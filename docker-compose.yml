# ============================================================================
# RentRoll — Docker Compose Multi-Service Orchestration (Phase 4)
# Configures Django Gunicorn WSGI Web Service + PostgreSQL 16 Database
# ============================================================================

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentroll_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=rentroll-prod-docker-compose-secret-key-change-in-prod-2026
      - JWT_SECRET=rentroll-prod-jwt-secret-docker-compose-2026
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgres://rentroll_user:rentroll_secure_pass@db:5432/rentroll_db
      - CORS_ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_indian_data &&
             gunicorn rentroll.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  db:
    image: postgres:16-alpine
    container_name: rentroll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentroll_db
      POSTGRES_USER: rentroll_user
      POSTGRES_PASSWORD: rentroll_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentroll_user -d rentroll_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

