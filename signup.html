<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — RentRoll</title>
  <meta name="description" content="Sign up for RentRoll to manage your rental portfolio or view your tenant lease and pay rent online.">
  
  <!-- Google Fonts: Inter -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <a href="#signup-card" class="skip-to-content">Skip to sign-up form</a>

  <!-- Injected Sticky Glass Navbar -->
  <header id="header-root"></header>

  <main class="main-content auth-wrapper">
    <div class="glass-card auth-card auth-card--wide" id="signup-card">
      <div class="auth-header">
        <div class="auth-header__logo" aria-hidden="true">
          <img src="assets/logo.svg" alt="RentRoll Logo" width="48" height="48" style="display:block;border-radius:13px;">
        </div>
        <h1 class="auth-header__title">Start with RentRoll</h1>
        <p class="auth-header__sub">Create your account in less than a minute</p>
      </div>

      <!-- General Form Alert Box -->
      <div id="signup-general-alert" class="form-error" role="alert" aria-live="polite" style="margin-bottom: var(--space-4);"></div>

      <!-- Sign Up Form -->
      <form id="signup-form" novalidate>
        <!-- Role Selector (Two Glass Radio Cards) -->
        <fieldset class="form-group" style="border: none; padding: 0; margin-bottom: var(--space-5);">
          <legend class="form-label">I am signing up as a:</legend>
          <div class="role-selector" role="radiogroup" aria-label="Select Account Role">
            <!-- Landlord Role Card -->
            <label class="role-card-label" for="role-landlord">
              <input type="radio" id="role-landlord" name="role" value="landlord" checked>
              <div class="role-card">
                <div class="role-card__header">
                  <div class="role-card__icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                  </div>
                  <div class="role-card__indicator"></div>
                </div>
                <div class="role-card__title">Landlord / Owner</div>
                <div class="role-card__desc">I own or manage 1–50 rental properties and units.</div>
              </div>
            </label>

            <!-- Tenant Role Card -->
            <label class="role-card-label" for="role-tenant">
              <input type="radio" id="role-tenant" name="role" value="tenant">
              <div class="role-card">
                <div class="role-card__header">
                  <div class="role-card__icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                  </div>
                  <div class="role-card__indicator"></div>
                </div>
                <div class="role-card__title">Tenant / Resident</div>
                <div class="role-card__desc">I rent a unit and want to pay rent and request repairs.</div>
              </div>
            </label>
          </div>
        </fieldset>

        <!-- Full Name -->
        <div class="form-group">
          <label for="signup-name" class="form-label">Full Name</label>
          <div class="form-input-wrap">
            <input 
              type="text" 
              id="signup-name" 
              name="name" 
              class="form-input" 
              placeholder="e.g. Rajesh Sharma" 
              autocomplete="name" 
              required
              aria-required="true"
            >
          </div>
          <div id="signup-name-error" class="form-error" role="alert" aria-live="polite"></div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="signup-email" class="form-label">Email Address</label>
          <div class="form-input-wrap">
            <input 
              type="email" 
              id="signup-email" 
              name="email" 
              class="form-input" 
              placeholder="name@example.com" 
              autocomplete="email" 
              required
              aria-required="true"
            >
          </div>
          <div id="signup-email-error" class="form-error" role="alert" aria-live="polite"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="signup-password" class="form-label">Password</label>
          <div class="form-input-wrap">
            <input 
              type="password" 
              id="signup-password" 
              name="password" 
              class="form-input form-input--has-icon-right" 
              placeholder="At least 8 characters" 
              autocomplete="new-password" 
              required
              aria-required="true"
            >
            <button type="button" id="signup-toggle-password" class="form-icon-btn" aria-label="Toggle password visibility"></button>
          </div>
          
          <!-- Real-time Password Strength Meter -->
          <div class="strength-meter" id="password-strength-meter" aria-live="polite">
            <div class="strength-meter__track">
              <div class="strength-meter__seg"></div>
              <div class="strength-meter__seg"></div>
              <div class="strength-meter__seg"></div>
              <div class="strength-meter__seg"></div>
            </div>
            <div class="strength-meter__info">
              <span class="strength-meter__label">Security level:</span>
              <span class="strength-meter__value">None</span>
            </div>
          </div>
          <div id="signup-password-error" class="form-error" role="alert" aria-live="polite"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="signup-confirm-password" class="form-label">Confirm Password</label>
          <div class="form-input-wrap">
            <input 
              type="password" 
              id="signup-confirm-password" 
              name="confirmPassword" 
              class="form-input form-input--has-icon-right" 
              placeholder="Re-enter password" 
              autocomplete="new-password" 
              required
              aria-required="true"
            >
            <button type="button" id="signup-toggle-confirm" class="form-icon-btn" aria-label="Toggle confirm password visibility"></button>
          </div>
          <div id="signup-confirm-error" class="form-error" role="alert" aria-live="polite"></div>
        </div>

        <!-- Terms Agreement Checkbox -->
        <div class="form-group">
          <label class="custom-checkbox">
            <input type="checkbox" id="signup-terms" name="terms" required aria-required="true">
            <span class="custom-checkbox__box">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            <span class="custom-checkbox__label">
              I agree to the <a href="javascript:void(0)" onclick="alert('Terms of Service: RentRoll provides software tools for rental management. In Phase 2, production legal terms will be linked here.')">Terms of Service</a> and <a href="javascript:void(0)" onclick="alert('Privacy Policy: RentRoll respects data security and confidentiality.')">Privacy Policy</a>.
            </span>
          </label>
          <div id="signup-terms-error" class="form-error" role="alert" aria-live="polite"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="signup-submit-btn" class="btn btn--primary btn--full btn--lg">
          <span class="btn__spinner" aria-hidden="true"></span>
          <span class="btn__text">Create Account</span>
        </button>
      </form>

      <!-- Auth Footer Switch -->
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Injected Glass Footer -->
  <footer id="footer-root"></footer>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
