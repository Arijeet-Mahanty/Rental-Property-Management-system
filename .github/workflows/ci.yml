name: RentRoll CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-test-secret-key-rentroll-2026"
          JWT_SECRET: "ci-test-jwt-secret-rentroll-2026"
        run: |
          python manage.py migrate

      - name: Verify Indian market data seeding
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-test-secret-key-rentroll-2026"
          JWT_SECRET: "ci-test-jwt-secret-rentroll-2026"
        run: |
          python manage.py seed_indian_data

      - name: Verify static files collection (WhiteNoise)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-test-secret-key-rentroll-2026"
          JWT_SECRET: "ci-test-jwt-secret-rentroll-2026"
        run: |
          python manage.py collectstatic --noinput

      - name: Run automated Django test suite
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-test-secret-key-rentroll-2026"
          JWT_SECRET: "ci-test-jwt-secret-rentroll-2026"
        run: |
          python manage.py test api --verbosity=2

