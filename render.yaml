services:
  - type: web
    name: rentroll
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn rentroll.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      # Cloud Database: Provide Neon Serverless Postgres (neon.tech) connection string,
      # or let Render provision the default attached database below.
      # Neon (neonbase) Pooled URI format:
      # postgresql://<user>:<pass>@<endpoint>-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        fromDatabase:
          name: rentroll-postgres
          property: connectionString

databases:
  # Optional: Render managed database (replace with Neon connection string above for permanent free tier)
  - name: rentroll-postgres
    region: oregon
    plan: free
    databaseName: rentroll_db
    user: rentroll_user

